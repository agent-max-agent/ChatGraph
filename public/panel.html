<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGraph</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header><strong>ChatGraph</strong><div id="header-actions"><select id="language" data-i18n-aria="language"><option value="auto" data-i18n="automatic"></option><option value="zh_CN">中文</option><option value="en">English</option></select><button id="refresh" data-i18n="refresh"></button></div></header>
  <h1 id="title" data-i18n="branches"></h1>
  <p id="status" role="status" data-i18n="initialStatus"></p>
  <div id="index-controls"><button id="index" data-i18n="indexStart"></button><span id="index-status" role="status" data-i18n="indexHint"></span></div>
  <nav><button id="out" data-i18n-aria="zoomOut">−</button><button id="fit" data-i18n="fit"></button><button id="in" data-i18n-aria="zoomIn">+</button></nav>
  <p id="legend" data-i18n="legend"></p>
  <div id="viewport"><div id="stage"><div id="canvas"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div></div>
  <section id="details"><p data-i18n="detailsHint"></p></section>
  <script type="module" src="panel.js"></script>
</body>
</html>
