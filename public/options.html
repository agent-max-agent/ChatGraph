<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGraph Settings</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <label for="language" id="language-label"></label>
      <select id="language">
        <option value="auto" id="automatic"></option>
        <option value="en">English</option>
        <option value="zh_CN">简体中文</option>
      </select>
      <p id="hint"></p>
      <section aria-labelledby="scan-settings-title">
        <h2 id="scan-settings-title" data-i18n="scanSettings"></h2>
        <label for="scan-interval" data-i18n="scanInterval"></label>
        <select id="scan-interval">
          <option value="3000" data-i18n="scanThreeSeconds"></option>
          <option value="4000" data-i18n="scanFourSeconds"></option>
          <option value="5000" data-i18n="scanFiveSeconds"></option>
        </select>
        <p data-i18n="indexHint"></p>
      </section>
      <section aria-labelledby="cache-title">
        <h2 id="cache-title" data-i18n="cacheTitle"></h2>
        <p data-i18n="cacheHint"></p>
        <div class="toolbar">
          <button id="inspect" aria-expanded="false" aria-controls="cache-list" data-i18n="cacheInspect"></button>
          <button id="clear-selected" data-i18n="cacheClearSelected"></button>
          <button id="clear-all" data-i18n="cacheClearAll"></button>
        </div>
        <p id="cache-summary" hidden></p>
        <p id="cache-status" role="status"></p>
        <p id="cache-empty" data-i18n="cacheEmpty" hidden></p>
        <div id="cache-list" hidden></div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
